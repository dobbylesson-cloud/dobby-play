<!DOCTYPE html>
<html lang="zh-Hant" data-i18n-title="index.pageTitle">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel World — 探索大家的創作</title>
<link rel="icon" type="image/png" href="index.icon.png?v=2">
<link rel="stylesheet" href="site.css?v=2026111302">
<script>
  // 舊分享連結（/#g=…）直接轉到遊戲頁，避免落在探索首頁。
  if (location.hash.indexOf('#g=') === 0) location.replace('play.html' + location.hash);
</script>
<script src="i18n.js?v=2026111302"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <img class="brand-mark" src="brand-icon.png" alt="Pixel World">
      <span class="brand-name">Pixel World</span>
    </a>
    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-type="game" data-i18n="tab.play">Play</button>
      <button class="tab" data-type="rooms" data-i18n="tab.game">遊戲</button>
      <button class="tab" data-type="animation" data-i18n="tab.animation">動畫</button>
      <button class="tab" data-type="background" data-i18n="tab.background">遠景</button>
      <button class="tab" data-type="character" data-i18n="tab.character">角色</button>
      <button class="tab" data-type="board" data-i18n="tab.board">畫板</button>
    </nav>
    <div class="topbar-right">
      <button class="hint-chip lang-toggle" type="button" data-lang-toggle aria-label="切換為英文">EN</button>
      <a class="hint-chip admin-link" id="adminLink" href="admin.html" data-i18n="admin.link">管理</a>
    </div>
  </div>
</header>

<main class="page">
  <div class="section-head">
    <h1 id="sectionTitle">Play遊戲</h1>
    <p id="sectionSub">所有人上傳的遊戲，點卡片就能玩。</p>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" hidden data-i18n="index.empty">這裡還沒有作品。</div>
</main>

<div class="toast" id="toast" hidden></div>
<script src="site.js?v=2026111303"></script>
</body>
</html>
